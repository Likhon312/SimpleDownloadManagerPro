name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pyinstaller
      - run: python -m PyInstaller --clean --onefile --windowed --name SimpleDownloadManagerPro download_manager.py
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleDownloadManagerPro-Windows
          path: dist/SimpleDownloadManagerPro.exe
          if-no-files-found: error
